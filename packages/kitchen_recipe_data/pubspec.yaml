name: kitchen_recipe_data
description: Drift-backed recipe persistence for Kitchen Notes.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  drift: ^2.34.2
  flutter:
    sdk: flutter
  kitchen_recipe_domain: ^0.1.0
  path: ^1.9.1
  path_provider: ^2.1.6
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.15.1
  drift_dev: ^2.34.5
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

hooks:
  user_defines:
    sqlite3:
      source: system
