services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kitchen
      POSTGRES_PASSWORD: kitchen-local-only
      POSTGRES_DB: kitchen_development
    ports:
      - "5432:5432"
    volumes:
      - ./.postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kitchen -d kitchen_development"]
      interval: 2s
      timeout: 3s
      retries: 15
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kitchen_test
      POSTGRES_PASSWORD: kitchen-test-only
      POSTGRES_DB: kitchen_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kitchen_test -d kitchen_test"]
      interval: 1s
      timeout: 3s
      retries: 20
